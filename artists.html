  <!-- Top Row: Song Info + Controls -->
  <div class="flex items-center w-full justify-between gap-4">

    <!-- Song Info -->
    <div class="flex items-center gap-4">
      <img
        id="player-cover"
        src=""
        class="w-14 h-14 rounded-lg object-cover shadow-md"
      />
      <div>
        <h3 id="player-title" class="font-semibold text-white">Song Title</h3>
        <p id="player-artist" class="text-gray-400 text-sm">Artist</p>
        <a href="download.html" class="text-cyan-400 text-xs hover:underline hover:text-cyan-300 transition">Download</a>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-4">
      <button id="prev-btn" class="text-xl hover:text-cyan-400 hover:scale-110 transition-transform duration-200">⏮</button>
      <button id="play-btn" class="text-2xl hover:text-cyan-400 hover:scale-110 transition-transform duration-200">▶</button>
      <button id="next-btn" class="text-xl hover:text-cyan-400 hover:scale-110 transition-transform duration-200">⏭</button>
    </div>
  </div>

  <!-- Bottom Row: Progress Bar -->
  <div class="flex items-center gap-4 w-full">
    <span id="currentTime" class="text-sm text-cyan-300">0:00</span>
    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0"
      class="w-full h-2 rounded-lg accent-cyan-400 bg-gray-700 cursor-pointer"
    />
    <span id="duration" class="text-sm text-cyan-300">0:00</span>
  </div>
